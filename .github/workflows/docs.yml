name: Documentation

on:
  pull_request:
    paths: ["docs/**", "examples/**", "pygrnwang/**", "pyproject.toml", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "examples/**", "pygrnwang/**", "pyproject.toml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install locked documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Check public API documentation coverage
        run: python docs/api/check_coverage.py
      - name: Strict HTML build from source
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html
      - name: Upload reviewable HTML
        uses: actions/upload-artifact@v7
        with:
          name: documentation-html
          path: docs/_build/html
          retention-days: 14
          include-hidden-files: true
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
