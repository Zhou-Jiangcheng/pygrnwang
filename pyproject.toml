[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygrnwang"
version = "3.0.0"
description = "A Python library for computing Green's function libaray."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zhou Jiangcheng", email = "zhou-jiangcheng@outlook.com" }]
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.13.1",
    "pandas>=2.1.4",
    "obspy>=1.5.0",
    "tqdm>=4.67.1"
]

[project.scripts]
pygrnwang = "pygrnwang.main:main"
edgrn2 = "pygrnwang.wrappers:run_edgrn2"
edcmp2 = "pygrnwang.wrappers:run_edcmp2"
qssp2020 = "pygrnwang.wrappers:run_qssp2020"
spgrn2012 = "pygrnwang.wrappers:run_spgrn2012"
spgrn2020 = "pygrnwang.wrappers:run_spgrn2020"
qseis06 = "pygrnwang.wrappers:run_qseis06"
qseis2025 = "pygrnwang.wrappers:run_qseis2025"

[project.urls]
Homepage = "https://github.com/Zhou-Jiangcheng/pygrnwang"
Documentation = "https://zhou-jiangcheng.github.io/pygrnwang/"
Source = "https://github.com/Zhou-Jiangcheng/pygrnwang"
Issues = "https://github.com/Zhou-Jiangcheng/pygrnwang/issues"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true
script-files = ["pygrnwang/exec/TauP.jar"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pygrnwang*"]
exclude = ["test*"]

[tool.setuptools.package-data]
pygrnwang = ["exec/*.jar", "java/*.java"]
